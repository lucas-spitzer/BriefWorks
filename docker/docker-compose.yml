services:
  redis:
    image: redis:7-alpine
    container_name: arsenal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arsenal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  arsenal_redis_data:
